<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Presync</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form id="settingsForm" class="app-layout">
        <div class="container">
            <div class="section-title">Discord Settings</div>
            <div class="form-group">
                <label for="statusDisplayMode">Status Mode</label>
                <select id="statusDisplayMode">
                    <option value="both">Both (Custom Status + Discord RPC)</option>
                    <option value="custom_status">Custom Status Only (Profile Text)</option>
                    <option value="rpc">Discord RPC Only (Rich Presence - Safe)</option>
                </select>
                <span class="helper-text" id="modeHelper">Menampilkan lirik di status profil dan Rich Presence</span>
            </div>
            <div class="form-group" id="tokenGroup">
                <label for="discordToken">Discord Token</label>
                <input type="password" id="discordToken" placeholder="Mfa.xyz..." />
            </div>
            <div class="form-group" id="appIdGroup">
                <label for="rpcAppId">RPC Application ID</label>
                <input type="text" id="rpcAppId" placeholder="1444178398372036789" />
            </div>

            <div class="section-title">Custom Status</div>

            <div class="form-group">
                <label for="customText1">Text 1</label>
                <input type="text" id="customText1" placeholder="Playing Games" />
            </div>
            <div class="form-group">
                <label for="customText2">Text 2</label>
                <input type="text" id="customText2" placeholder="Streaming Youtube" />
            </div>
            <div class="form-group">
                <label for="customText3">Text 3</label>
                <input type="text" id="customText3" placeholder="Listening Music" />
            </div>
            <div class="form-group">
                <label for="customTime">Time Changed</label>
                <div class="party-row">
                    <span>Time</span>
                    <input type="number" id="customTime" min="0" value="0" />
                </div>
            </div>
            <div class="section-header-row">
                <div class="section-title">Lyric Status</div>
                <button type="button" id="lyricToggleBtn" class="saklar-container off" title="Toggle Lyric Status">
                    <span class="saklar-track">
                        <span class="saklar-handle"></span>
                    </span>
                    <span id="lyricToggleText" class="saklar-label">OFF</span>
                </button>
            </div>

            <div id="lyricSyncContainer" class="hidden">
                <div class="form-group">
                    <label for="mediaSourceSelect">Media Source</label>
                    <select id="mediaSourceSelect">
                        <option value="os_media">OS Media (Spotify / Browser / Apple Music)</option>
                        <option value="spicetify">Spicetify WebSocket (Port 8974)</option>
                    </select>
                    <span class="helper-text" id="mediaSourceHelper" style="color: #23a559;">✓ Membaca sesi musik langsung dari OS Windows tanpa Spicetify</span>
                </div>
                <div class="form-group" style="margin-top: 10px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                        <label for="lyricsOffset" style="margin-bottom: 0;">Lyrics Offset (Timing)</label>
                        <span id="offsetValueText" style="font-size: 12px; color: #5865f2; font-weight: bold;">+0.4s</span>
                    </div>
                    <input type="range" id="lyricsOffset" min="-2.0" max="2.0" step="0.1" value="0.4" style="accent-color: #5865f2; cursor: pointer; width: 100%;" />
                    <span class="helper-text">Kompensasi latency: geser kiri jika lirik telat, kanan jika terlalu cepat.</span>
                </div>
                <div class="divider"></div>
                <div class="logs" id="logsContainer">
                    <div class="log-entry">Welcome to Presync!</div>
                </div>
            </div>
        </div>
        <div class="footer-sticky">
            <div class="action-buttons">
                <div>
                    <button type="submit" id="btnConnect" class="btn-primary" disabled>Connect</button>
                    <button type="button" id="btnDisconnect" class="btn-secondary" disabled>Disconnect</button>
                </div>
                <button type="button" id="btnRestart" class="btn-secondary" disabled>Restart</button>
            </div>
            <div class="status-bar">
                <span class="status-indicator disconnected" id="statusDot"></span>
                <span id="statusText">Disconnected</span>
            </div>
        </div>
    </form>
    <script src="renderer.js"></script>
</body>
</html>
