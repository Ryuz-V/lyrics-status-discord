<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Presync 1.0.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header-menu">
        <span>File</span>
        <span>Settings</span>
        <span>Help</span>
    </div>
    <form id="settingsForm" class="app-layout">
        <div class="container">
            <!-- Discord Section -->
            <div class="section-title">Discord Settings</div>
            <div class="form-group">
                <label for="discordToken">Discord Token</label>
                <input type="password" id="discordToken" placeholder="Mfa.xyz..." />
            </div>
            <div class="form-group">
                <label for="rpcAppId">ID</label>
                <input type="text" id="rpcAppId" placeholder="1444178398372036789" />
            </div>

            <div class="section-title">Custom Status</div>

            <div class="form-group">
                <label for="customText1">Text 1</label>
                <input type="text" id="customText1" placeholder="Playing Games" />
            </div>
            <div class="form-group">
                <label for="customText2">Text 2</label>
                <input type="text" id="customText2" placeholder="Streaming Youtube" />
            </div>
            <div class="form-group">
                <label for="customText3">Text 3</label>
                <input type="text" id="customText3" placeholder="Listening Music" />
            </div>
            <!-- Time Changed -->
            <div class="form-group">
                <label for="customTime">Time Changed</label>
                <div class="party-row">
                    <span>Time</span>
                    <input type="number" id="customTime" min="0" value="0" />
                </div>
            </div>

            <!-- Lyric Status Header with Saklar Switch -->
            <div class="section-header-row">
                <div class="section-title">Lyric Status</div>
                <button type="button" id="lyricToggleBtn" class="saklar-container off" title="Toggle Lyric Status">
                    <span class="saklar-track">
                        <span class="saklar-handle"></span>
                    </span>
                    <span id="lyricToggleText" class="saklar-label">OFF</span>
                </button>
            </div>

            <div id="lyricSyncContainer" class="hidden">
                <div class="form-group">
                    <span class="helper-text" style="color: #23a559;">✓ Menggunakan Spicetify (Non-Premium)</span>
                </div>
                <div class="divider"></div>
                <div class="logs" id="logsContainer">
                    <div class="log-entry">Welcome to Presync!</div>
                </div>
            </div>
        </div>

        <!-- Sticky Footer -->
        <div class="footer-sticky">
            <div class="action-buttons">
                <div>
                    <button type="submit" id="btnConnect" class="btn-primary" disabled>Connect</button>
                    <button type="button" id="btnDisconnect" class="btn-secondary" disabled>Disconnect</button>
                    <button type="button" id="btnUpdatePresence" class="btn-secondary" disabled>Update Presence</button>
                </div>
                <button type="button" id="btnRestart" class="btn-secondary" disabled>Restart</button>
            </div>

            <!-- Status Indicator -->
            <div class="status-bar">
                <span class="status-indicator disconnected" id="statusDot"></span>
                <span id="statusText">Disconnected</span>
            </div>
        </div>
    </form>
    <script src="renderer.js"></script>
</body>
</html>
